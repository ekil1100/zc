name: Bug 报告
description: 报告 zc 的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: zc 版本
      description: 运行 `zc --version` 获取版本
      placeholder: v1.0.0
    validations:
      required: true
  
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Linux
        - 其他
    validations:
      required: true
  
  - type: input
    id: arch
    attributes:
      label: 架构
      description: amd64 / arm64
      placeholder: arm64
  
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 描述你遇到的问题
      placeholder: 清晰简洁地描述 bug
    validations:
      required: true
  
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 运行命令 '...'
        2. 配置 '...'
        3. 出现错误
    validations:
      required: true
  
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
  
  - type: textarea
    id: logs
    attributes:
      label: 日志/错误信息
      description: 相关日志（请脱敏）
      render: shell
  
  - type: textarea
    id: config
    attributes:
      label: 相关配置
      description: 如有必要，提供脱敏后的配置片段
      render: yaml
  
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已经搜索过现有 issue，确认这不是重复问题
          required: true
        - label: 我已经尝试了最新版本，问题仍然存在
          required: false

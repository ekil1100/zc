name: CD Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ github.ref_name }}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          EXPECTED_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION=$(awk -F'"' '/^[[:space:]]*\.version = / { print $2; exit }' build.zig.zon)
          if [[ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Tag/package version mismatch: tag=$EXPECTED_VERSION package=$PACKAGE_VERSION" >&2
            exit 1
          fi

  release:
    needs: validate-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            target_arch: amd64
          - os: macos-latest
            target_os: macos
            target_arch: arm64
          - os: macos-15-intel
            target_os: macos
            target_arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: step-security/setup-zig@v2.2.2
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline

      - name: Verify binary version
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ github.ref_name }}"
          EXPECTED="zc ${RELEASE_TAG#v}"
          ACTUAL=$(./zig-out/bin/zc --version)
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Tag/binary version mismatch: expected='$EXPECTED' actual='$ACTUAL'" >&2
            exit 1
          fi

      - name: Test
        run: zig build test -Dcpu=baseline

      - name: Smoke (migrator regression)
        run: bash tools/config-migrator/run-all.sh

      - name: Smoke (install regression)
        run: bash scripts/install/run-all-regression.sh

      - name: Package
        run: |
          mkdir -p dist
          PKG_NAME="zc-${{ github.ref_name }}-${{ matrix.target_os }}-${{ matrix.target_arch }}"
          PKG_DIR="dist/${PKG_NAME}"
          mkdir -p "$PKG_DIR"
          cp ./zig-out/bin/zc "$PKG_DIR/"
          cp ./README.md ./LICENSE "$PKG_DIR/"
          tar -czf "dist/${PKG_NAME}.tar.gz" -C dist "$PKG_NAME"
          if command -v shasum >/dev/null 2>&1; then
            (cd dist && shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256")
          else
            (cd dist && sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256")
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/*.tar.gz*

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

  update-tap:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: ekil1100/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: homebrew-tap

      - name: Download release assets and render formula
        shell: bash
        run: |
          set -euo pipefail
          cd homebrew-tap
          VERSION="${{ github.ref_name }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $VERSION" >&2
            exit 1
          fi

          curl --retry 3 --retry-all-errors -fsSL "https://github.com/ekil1100/zc/releases/download/${VERSION}/zc-${VERSION}-macos-arm64.tar.gz" -o macos-arm64.tar.gz
          curl --retry 3 --retry-all-errors -fsSL "https://github.com/ekil1100/zc/releases/download/${VERSION}/zc-${VERSION}-macos-amd64.tar.gz" -o macos-amd64.tar.gz
          curl --retry 3 --retry-all-errors -fsSL "https://github.com/ekil1100/zc/releases/download/${VERSION}/zc-${VERSION}-linux-amd64.tar.gz" -o linux-amd64.tar.gz

          MACOS_ARM64_SHA=$(sha256sum macos-arm64.tar.gz | cut -d' ' -f1)
          MACOS_AMD64_SHA=$(sha256sum macos-amd64.tar.gz | cut -d' ' -f1)
          LINUX_AMD64_SHA=$(sha256sum linux-amd64.tar.gz | cut -d' ' -f1)

          cat > zc.rb <<EOF
          class Zc < Formula
            desc "CLI-first proxy runtime compatible with Clash configurations"
            homepage "https://github.com/ekil1100/zc"
            license "MIT"

            livecheck do
              url :stable
              regex(/^v?(\d+(?:\.\d+)*-rc\d+)$/i)
              strategy :git
            end

            on_macos do
              on_arm do
                url "https://github.com/ekil1100/zc/releases/download/${VERSION}/zc-${VERSION}-macos-arm64.tar.gz"
                sha256 "${MACOS_ARM64_SHA}"
              end
              on_intel do
                url "https://github.com/ekil1100/zc/releases/download/${VERSION}/zc-${VERSION}-macos-amd64.tar.gz"
                sha256 "${MACOS_AMD64_SHA}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/ekil1100/zc/releases/download/${VERSION}/zc-${VERSION}-linux-amd64.tar.gz"
                sha256 "${LINUX_AMD64_SHA}"
              end
            end

            def install
              bin.install "zc"
            end

            test do
              system bin/"zc", "--help"
            end
          end
          EOF

          ruby -c zc.rb
          rm -f macos-arm64.tar.gz macos-amd64.tar.gz linux-amd64.tar.gz

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zc.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date"
          else
            git commit -m "chore(zc): update to ${{ github.ref_name }}"
            git push
          fi

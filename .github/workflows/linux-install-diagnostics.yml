name: Linux install diagnostics
on:
  push:
    branches: [ci/linux-install-diagnostics]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo build --locked --example e2e_service_install
      - name: Validate release service package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/diagnostics
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          python3 scripts/install/test-release-service.py "$PWD" "$PWD/target/debug/examples/e2e_service_install" "$work" 2>&1 | tee target/diagnostics/service-package.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-package-${{ matrix.os }}
          path: target/diagnostics

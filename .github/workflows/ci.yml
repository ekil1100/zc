name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Validate release workflow
        run: bash scripts/ci/test-release-workflow.sh

      - name: Validate beta gate
        run: bash scripts/ci/test-beta-gate.sh

      - name: Setup Zig
        uses: step-security/setup-zig@v2.2.2
        with:
          version: 0.16.0

      - name: Build
        run: just build

      - name: Test
        run: just test

      - name: Smoke (migrator regression)
        run: just migrator-regression

      - name: Smoke (install regression)
        run: just install-regression

      - name: Eval framework selfcheck
        run: just eval-selfcheck

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: step-security/setup-zig@v2.2.2
        with:
          version: 0.16.0

      - name: End-to-end release gate
        run: >-
          zig build e2e-release
          -Dtarget=x86_64-linux-musl
          -Doptimize=ReleaseSafe
          -Dcpu=baseline
          --summary all

      - name: Verify default runtime port
        run: |
          zig build \
            -Dtarget=x86_64-linux-musl \
            -Doptimize=ReleaseSafe \
            -Dcpu=baseline
          bash scripts/ci/test-default-runtime-port.sh zig-out/bin/zc

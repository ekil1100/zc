name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-delivery:
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select macOS linker
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun ld -v
          xcrun --show-sdk-version
      - name: Setup just
        uses: extractions/setup-just@v3
      - name: Setup independent crypto oracle
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - name: Install native musl build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake build-essential pkg-config
      - name: Format and lint
        run: just check
      - name: Test public interfaces
        run: just test
      - name: Validate delivery contracts
        run: just delivery-test
      - name: Validate beta gate contract
        run: bash scripts/ci/test-beta-gate.sh
      - name: Independent core and TCP interoperability
        run: just e2e
      - name: Isolated installer regression
        run: just install-test
      - name: Build production artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ runner.os }}' == Linux ]]; then
            export CC=musl-gcc
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          fi
          cargo build --locked --release --target ${{ matrix.target }} --bin zc
          BINARY="target/${{ matrix.target }}/release/zc"
          file "$BINARY"
          if [[ '${{ runner.os }}' == Linux ]]; then
            file "$BINARY" | grep -Eq 'statically linked|static-pie linked'
          else
            python3 scripts/ci/verify-macos-artifact.py "$BINARY"
            codesign --verify --strict "$BINARY"
            python3 scripts/ci/test-macos-launch.py "$BINARY"
          fi
          "$BINARY" --version
          bash scripts/e2e/run-core.sh "$PWD/$BINARY" "$PWD/target/debug/examples/e2e_origin" "$PWD/target/debug/examples/e2e_obfs_oracle" "$PWD/target/debug/examples/e2e_ss_udp_oracle" "$PWD/target/e2e-fixtures" "$PWD/testdata/e2e"
          TMPDIR="$(cd "${TMPDIR:-/tmp}" && pwd -P)" python3 scripts/e2e/run-rust-tcp.py "$BINARY" target/e2e-fixtures
          bash scripts/install/test-oneline-installer.sh "$PWD/$BINARY" "$PWD/target/debug/examples/e2e_origin"
      - name: Verify native macOS first use in disposable runner
        if: runner.os == 'macOS'
        run: python3 scripts/ci/test-macos-native.py --ephemeral-runner --target ${{ matrix.target }}
      - name: Verify default runtime port in isolated CI
        if: runner.os == 'Linux'
        run: bash scripts/ci/test-default-runtime-port.sh target/${{ matrix.target }}/release/zc

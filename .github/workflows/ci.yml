name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release workflow
        run: bash scripts/ci/test-release-workflow.sh

      - name: Setup Zig
        uses: step-security/setup-zig@v2.2.2
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Dcpu=baseline

      - name: Test
        run: zig build test -Dcpu=baseline

      - name: Smoke (migrator regression)
        run: bash tools/config-migrator/run-all.sh

      - name: Smoke (install regression)
        run: bash scripts/install/run-all-regression.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: step-security/setup-zig@v2.2.2
        with:
          version: 0.16.0

      - name: End-to-end release gate
        run: >-
          zig build e2e-release
          -Dtarget=x86_64-linux-musl
          -Doptimize=ReleaseSafe
          -Dcpu=baseline
          --summary all

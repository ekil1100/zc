port: 0
socks-port: 0
mixed-port: 9000
redir-port: 0
tproxy-port: 0
allow-lan: false
ipv6: true
bind-address: "*"
mode: "rule"
log-level: "info"
idle-session-check-interval: 30
idle-session-timeout: 30
min-idle-session: 0
proxies:
  - name: "vless-node"
    type: "vless"
    server: "example.com"
    port: 443
    uuid: "******"
    network: "ws"
    grpc-opts: {}
    ws-opts:
      path: "/ws"
      headers:
        Host: "example.com"
  - name: "direct-node"
    type: "direct"
    server: ""
    port: 0
proxy-groups:
  - name: "Empty"
    type: "relay"
    proxies:
    interval: 300
    tolerance: 100
    lazy: true
rules:
  - "MATCH,DIRECT"

[package]
name = "zc"
version = "1.0.1-rust.1"
edition = "2024"
rust-version = "1.91"
description = "CLI-first proxy runtime compatible with a bounded Clash configuration subset"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
httparse = "1.10"
hickory-resolver = "0.26"
ipnet = "2.12"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.2", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
shadowsocks = { version = "1.25", default-features = false, features = ["aead-cipher"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws_lc_rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
